<div class="dashboard-grid">
    <mat-card class="stat-card total-customers">
        <mat-card-header>
            <mat-icon mat-card-avatar>people</mat-icon>
            <mat-card-title>Total Customers</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <h2 class="stat-value">{{ stats().totalCustomers }}</h2>
        </mat-card-content>
    </mat-card>

    <mat-card class="stat-card total-pending">
        <mat-card-header>
            <mat-icon mat-card-avatar class="debit-text">account_balance_wallet</mat-icon>
            <mat-card-title>Total Pending</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <h2 class="stat-value debit-text">₹ {{ stats().totalPending | number:'1.2-2' }}</h2>
        </mat-card-content>
    </mat-card>

    <mat-card class="stat-card today-debit">
        <mat-card-header>
            <mat-icon mat-card-avatar class="debit-text">arrow_upward</mat-icon>
            <mat-card-title>Today's Debit</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <h2 class="stat-value debit-text">₹ {{ stats().todayDebit | number:'1.2-2' }}</h2>
        </mat-card-content>
    </mat-card>

    <mat-card class="stat-card today-credit">
        <mat-card-header>
            <mat-icon mat-card-avatar class="credit-text">arrow_downward</mat-icon>
            <mat-card-title>Today's Credit</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <h2 class="stat-value credit-text">₹ {{ stats().todayCredit | number:'1.2-2' }}</h2>
        </mat-card-content>
    </mat-card>
</div>
